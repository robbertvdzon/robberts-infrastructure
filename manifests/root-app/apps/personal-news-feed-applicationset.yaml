apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: personal-news-feed-previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - pullRequest:
      github:
        owner: robbertvdzon
        repo: personal-news-feed-by-claude-code
        labels: []
        tokenRef:
          secretName: github-pr-token
          key: token
      requeueAfterSeconds: 180
      filters:
      - branchMatch: ^ai/.+$
  template:
    metadata:
      name: preview-{{.number}}-{{.branch_slug}}
      labels:
        app.kubernetes.io/part-of: personal-news-feed
        app.kubernetes.io/managed-by: argocd
        preview-pr: '{{.number}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/robbertvdzon/personal-news-feed-by-claude-code.git
        targetRevision: '{{.head_sha}}'
        path: deploy/overlays/preview
        kustomize:
          namespace: pnf-pr-{{.number}}
          patches:
          - target:
              group: route.openshift.io
              version: v1
              kind: Route
              name: frontend
            patch: "- op: replace\n  path: /spec/host\n  value: 'pnf-pr-{{.number}}.vdzonsoftware.nl'"
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: backend
            patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: backend\n\
              spec:\n  template:\n    spec:\n      containers:\n      - name: backend\n\
              \        resources:\n          requests:\n            memory: 320Mi\n\
              \          limits:\n            memory: 448Mi\n        env:\n      \
              \  - name: JAVA_TOOL_OPTIONS\n          value: -Xmx192m -XX:+UseSerialGC"
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: frontend
            patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: frontend\n\
              spec:\n  template:\n    spec:\n      containers:\n      - name: frontend\n\
              \        resources:\n          requests:\n            memory: 32Mi\n\
              \          limits:\n            memory: 64Mi"
          - target:
              group: apps
              version: v1
              kind: Deployment
              name: reader
            patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: reader\n\
              spec:\n  template:\n    spec:\n      containers:\n      - name: reader\n\
              \        resources:\n          requests:\n            memory: 32Mi\n\
              \          limits:\n            memory: 64Mi"
          - target:
              kind: Deployment
              name: backend
            patch: "apiVersion: apps/v1\nkind: Deployment\nmetadata:\n  name: backend\n\
              spec:\n  template:\n    metadata:\n      labels:\n        postgres.vdzonsoftware.nl/client:\
              \ 'true'\n    spec:\n      containers:\n      - name: backend\n    \
              \    env:\n        - name: PNF_DATABASE_URL\n          value: null\n\
              \          valueFrom:\n            secretKeyRef:\n              name:\
              \ preview-postgres\n              key: url\n        - name: PNF_DATABASE_USER\n\
              \          value: null\n          valueFrom:\n            secretKeyRef:\n\
              \              name: preview-postgres\n              key: username\n\
              \        - name: PNF_DATABASE_PASSWORD\n          value: null\n    \
              \      valueFrom:\n            secretKeyRef:\n              name: preview-postgres\n\
              \              key: password\n        - name: SPRING_DATASOURCE_URL\n\
              \          value: null\n          valueFrom:\n            secretKeyRef:\n\
              \              name: preview-postgres\n              key: url\n    \
              \    - name: SPRING_DATASOURCE_USERNAME\n          value: null\n   \
              \       valueFrom:\n            secretKeyRef:\n              name: preview-postgres\n\
              \              key: username\n        - name: SPRING_DATASOURCE_PASSWORD\n\
              \          value: null\n          valueFrom:\n            secretKeyRef:\n\
              \              name: preview-postgres\n              key: password\n\
              \        - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE\n      \
              \    value: '5'\n        - name: SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE\n\
              \          value: '0'\n        - name: PNF_AGENT_RUNTIME_TOKEN\n   \
              \       value: null\n          valueFrom:\n            secretKeyRef:\n\
              \              name: pnf-preview-runtime\n              key: PNF_AGENT_RUNTIME_TOKEN\n\
              \        - name: PNF_GOOGLE_CLIENT_ID\n          value: ''\n       \
              \   valueFrom: null\n        - name: PNF_GOOGLE_USERS\n          value:\
              \ preview@pnf.invalid=preview\n          valueFrom: null\n        -\
              \ name: APP_JWT_SECRET\n          value: ''\n          valueFrom: null\n\
              \        - name: PNF_AGENT_RUNTIME_URL\n          value: https://agent-runtime-acceptance.vdzonsoftware.nl\n\
              \        volumeMounts:\n        - name: central-postgres-ca\n      \
              \    mountPath: /etc/postgres-ca\n          readOnly: true\n      volumes:\n\
              \      - name: central-postgres-ca\n        secret:\n          secretName:\
              \ preview-postgres\n          items:\n          - key: ca.crt\n    \
              \        path: ca.crt\n"
          - target:
              kind: StatefulSet
              name: database
            patch: "$patch: delete\napiVersion: apps/v1\nkind: StatefulSet\nmetadata:\n\
              \  name: database\n"
          - target:
              kind: Deployment
              name: postgres
            patch: "$patch: delete\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
              \  name: postgres\n"
          - target:
              kind: Service
              name: database
            patch: "$patch: delete\napiVersion: v1\nkind: Service\nmetadata:\n  name:\
              \ database\n"
          - target:
              kind: Service
              name: postgres
            patch: "$patch: delete\napiVersion: v1\nkind: Service\nmetadata:\n  name:\
              \ postgres\n"
          - target:
              kind: PersistentVolumeClaim
              name: database-data
            patch: "$patch: delete\napiVersion: v1\nkind: PersistentVolumeClaim\n\
              metadata:\n  name: database-data\n"
          - target:
              kind: PersistentVolumeClaim
              name: postgres-data
            patch: "$patch: delete\napiVersion: v1\nkind: PersistentVolumeClaim\n\
              metadata:\n  name: postgres-data\n"
          images:
          - ghcr.io/robbertvdzon/personal-news-feed-backend=ghcr.io/robbertvdzon/personal-news-feed-backend:sha-{{.head_short_sha_7}}
          - ghcr.io/robbertvdzon/personal-news-feed-frontend=ghcr.io/robbertvdzon/personal-news-feed-frontend:sha-{{.head_short_sha_7}}
      destination:
        server: https://kubernetes.default.svc
        namespace: pnf-pr-{{.number}}
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: argocd
            preview.vdzonsoftware.nl/managed-by: preview-reconciler
            preview.vdzonsoftware.nl/repository: personal-news-feed-by-claude-code
            preview.vdzonsoftware.nl/pr-number: '{{.number}}'
        syncOptions:
        - CreateNamespace=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2

# Productie volgt de expliciete production-overlay. De applicatierepository wijzigt deze overlay
# pas nadat exact dezelfde images op acceptatie zijn uitgerold en de rooktest daar is geslaagd.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-factory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: product-factory
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robbertvdzon/product-factory.git
    targetRevision: main
    path: deploy/overlays/production
  destination:
    server: https://kubernetes.default.svc
    namespace: product-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5

# Registreer na de eerste geslaagde imagebuild en GitOps image-pin in de app-repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: maceclubheemskerk
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: maceclubheemskerk
spec:
  project: default
  source:
    repoURL: https://github.com/robbertvdzon/maceclubheemskerk.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: maceclubheemskerk
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: argocd
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5

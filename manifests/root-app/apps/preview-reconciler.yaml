apiVersion: v1
kind: ServiceAccount
metadata:
  name: preview-reconciler
  namespace: argocd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: preview-reconciler
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: preview-reconciler
subjects:
  - kind: ServiceAccount
    name: preview-reconciler
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: preview-reconciler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: preview-reconciler-applications
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: preview-reconciler-applications
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: preview-reconciler
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: preview-reconciler-applications
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-reconciler
  namespace: argocd
  labels:
    app.kubernetes.io/name: preview-reconciler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: preview-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: preview-reconciler
    spec:
      serviceAccountName: preview-reconciler
      containers:
        - name: reconciler
          image: ghcr.io/robbertvdzon/preview-reconciler:sha-ae1b86e
          imagePullPolicy: Always
          env:
            - name: GITHUB_OWNER
              value: robbertvdzon
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: github-pr-token
                  key: token
            - name: INTERVAL_SECONDS
              value: "180"
            - name: GRACE_SECONDS
              value: "600"
          ports:
            - name: metrics
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: preview-reconciler
  namespace: argocd
  labels:
    app.kubernetes.io/name: preview-reconciler
spec:
  selector:
    app.kubernetes.io/name: preview-reconciler
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics

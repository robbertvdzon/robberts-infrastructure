# Retired: postgres-preview-controller owns isolated PNF preview databases.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-ns-labeller
  namespace: argocd
  labels:
    app: preview-ns-labeller
spec:
  replicas: 0
  selector:
    matchLabels:
      app: preview-ns-labeller
  template:
    metadata:
      labels:
        app: preview-ns-labeller
    spec:
      serviceAccountName: preview-ns-labeller
      containers:
      - name: labeller
        image: ghcr.io/robbertvdzon/preview-ns-labeller:sha-954d5f3
        imagePullPolicy: Always
        env:
        - name: ARGOCD_NS
          value: argocd
        - name: NS_PREFIX
          value: pnf-pr-
        - name: INTERVAL
          value: '30'
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-pr-token
              key: token
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 256Mi

# Standing acceptatieomgeving voor hkh: altijd bereikbaar, zonder login, met geseede demodata
# (deploy/overlays/acceptance in de hkh-repo). In tegenstelling tot hkh-applicationset.yaml (per-PR,
# tijdelijk) is dit één vaste Application die main volgt. Productie zelf wordt nog handmatig via
# hkh/deploy/argocd/application.yaml toegepast; deze acceptance-Application staat bewust wel hier
# (git-tracked, automatisch gesynchroniseerd door de app-of-apps root) zodat er geen handmatige
# oc apply-stap bij komt.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hkh-acceptance
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/part-of: hkh
    app.kubernetes.io/managed-by: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/robbertvdzon/hkh.git
    targetRevision: main
    path: deploy/overlays/acceptance
  destination:
    server: https://kubernetes.default.svc
    namespace: hkh-acceptance
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 5

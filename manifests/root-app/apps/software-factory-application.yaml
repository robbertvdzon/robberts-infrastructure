# De volledige Software Factory (factory, dashboard-API, frontend en eigen
# PostgreSQL) in namespace software-factory. Hernoemd van
# softwarefactory-dashboard op 2026-09-12 toen de factory zelf naar de
# cluster verhuisde. De deploy-manifesten (met CI-gebumpte image-tags) staan
# in de software-factory-repo zelf, zie spec.source hieronder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: software-factory
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/robbertvdzon/software-factory.git
    targetRevision: main
    path: deploy/base
  destination:
    server: https://kubernetes.default.svc
    namespace: software-factory
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m

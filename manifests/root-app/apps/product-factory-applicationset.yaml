apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: product-factory-previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - pullRequest:
        github:
          owner: robbertvdzon
          repo: product-factory
          labels: []
          tokenRef:
            secretName: github-pr-token
            key: token
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'product-factory-preview-{{.number}}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
      labels:
        app.kubernetes.io/part-of: product-factory
        app.kubernetes.io/managed-by: argocd
        preview-pr: '{{.number}}'
    spec:
      project: default
      source:
        repoURL: https://github.com/robbertvdzon/product-factory.git
        targetRevision: '{{.head_sha}}'
        path: deploy/overlays/preview
        kustomize:
          namespace: 'product-factory-pr-{{.number}}'
          patches:
            # PF_PREVIEW_PR_NUMBER is per PR uniek en hoort dus niet in het gecommitte
            # preview-secret.yaml; PreviewRuntimeConfig weigert op te starten zonder dit nummer
            # zodra PF_PREVIEW_ENABLED aan staat (zie productfactory/.../preview/PreviewRuntimeConfig.kt).
            - target:
                group: apps
                version: v1
                kind: Deployment
                name: runtime
              patch: |-
                - op: add
                  path: /spec/template/spec/containers/0/env
                  value:
                    - name: PF_PREVIEW_PR_NUMBER
                      value: '{{.number}}'
            # Alle drie de Routes krijgen een eigen hostnaam: de frontend bakt de backend-URL op
            # build-tijd in (geen same-origin proxy zoals bij hkh), en de runtime-Route moet
            # bereikbaar zijn zodat een tester het mock-agent-bridge-controle-endpoint kan aanroepen.
            - target:
                group: route.openshift.io
                version: v1
                kind: Route
                name: dashboard-frontend
              patch: |-
                - op: replace
                  path: /spec/host
                  value: 'product-factory-pr-{{.number}}.vdzonsoftware.nl'
            - target:
                group: route.openshift.io
                version: v1
                kind: Route
                name: dashboard-backend
              patch: |-
                - op: replace
                  path: /spec/host
                  value: 'product-factory-api-pr-{{.number}}.vdzonsoftware.nl'
            - target:
                group: route.openshift.io
                version: v1
                kind: Route
                name: runtime
              patch: |-
                - op: replace
                  path: /spec/host
                  value: 'product-factory-runtime-pr-{{.number}}.vdzonsoftware.nl'
          images:
            - 'ghcr.io/robbertvdzon/product-factory-runtime=ghcr.io/robbertvdzon/product-factory-runtime:sha-{{.head_sha}}'
            - 'ghcr.io/robbertvdzon/product-factory-dashboard-backend=ghcr.io/robbertvdzon/product-factory-dashboard-backend:sha-{{.head_sha}}'
            - 'ghcr.io/robbertvdzon/product-factory-dashboard-frontend=ghcr.io/robbertvdzon/product-factory-dashboard-frontend:sha-{{.head_sha}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'product-factory-pr-{{.number}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            argocd.argoproj.io/managed-by: argocd
            preview.vdzonsoftware.nl/managed-by: preview-reconciler
            preview.vdzonsoftware.nl/repository: product-factory
            preview.vdzonsoftware.nl/pr-number: '{{.number}}'
        syncOptions:
          - CreateNamespace=true
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m

apiVersion: v1
kind: Namespace
metadata:
  name: postgres-nonproduction
  labels:
    argocd.argoproj.io/managed-by: argocd
    postgres.vdzonsoftware.nl/tier: nonproduction
    openshift.io/cluster-monitoring: 'true'
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: postgres-nonproduction
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-server
  namespace: postgres-nonproduction
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-server-scc
  namespace: postgres-nonproduction
subjects:
- kind: ServiceAccount
  name: postgres-server
  namespace: postgres-nonproduction
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:local-path-postgresql
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-provision
  namespace: postgres-nonproduction
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1

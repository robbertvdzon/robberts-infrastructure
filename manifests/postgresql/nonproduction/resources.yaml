apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: postgres-nonproduction
data:
  postgresql.conf: 'listen_addresses=''*''

    port=5432

    hba_file=''/config/pg_hba.conf''

    max_connections=100

    shared_buffers=128MB

    effective_cache_size=512MB

    work_mem=2MB

    maintenance_work_mem=32MB

    autovacuum_work_mem=16MB

    max_wal_size=512MB

    password_encryption=''scram-sha-256''

    timezone=''Etc/UTC''

    ssl=on

    ssl_cert_file=''/run/postgres-tls/server.crt''

    ssl_key_file=''/run/postgres-tls/server.key''

    log_statement=''none''

    log_min_error_statement=''panic''

    log_error_verbosity=''terse''

    '
  pg_hba.conf: 'local all postgres trust

    local all all reject

    hostnossl all all 0.0.0.0/0 reject

    hostssl all postgres 0.0.0.0/0 scram-sha-256

    hostssl all platform_backup 0.0.0.0/0 scram-sha-256

    hostssl postgres platform_monitor 0.0.0.0/0 scram-sha-256

    hostssl sameuser all 0.0.0.0/0 scram-sha-256

    host all all 0.0.0.0/0 reject

    '
  registry.json: "{\n  \"databases\": [\n    {\n      \"name\": \"ar_acc\"\n    },\n\
    \    {\n      \"name\": \"hkh_acc\"\n    },\n    {\n      \"name\": \"hkh_autopilot_acc\"\
    \n    },\n    {\n      \"name\": \"pf_acc\"\n    },\n    {\n      \"name\": \"\
    pvdd_acc\"\n    }\n  ]\n}"
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: postgres-nonproduction
spec:
  selector:
    app: central-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: postgres-nonproduction
spec:
  selector:
    app: central-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: postgres-nonproduction
spec:
  serviceName: postgres-headless
  replicas: 1
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: central-postgres
  template:
    metadata:
      labels:
        app: central-postgres
    spec:
      serviceAccountName: postgres-server
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seLinuxOptions:
          type: spc_t
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: tls-permissions
        image: docker.io/library/postgres@sha256:1938c16e9d2f10a6a3623b344b64ae8d45f407f2c5f34f0979468bb689b9227a
        command:
        - sh
        - -ec
        - cp /tls/tls.crt /run/postgres-tls/server.crt; cp /tls/tls.key /run/postgres-tls/server.key;
          chmod 600 /run/postgres-tls/server.key
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: tls-private
          mountPath: /run/postgres-tls
      containers:
      - name: postgres
        image: docker.io/library/postgres@sha256:1938c16e9d2f10a6a3623b344b64ae8d45f407f2c5f34f0979468bb689b9227a
        args:
        - postgres
        - -c
        - config_file=/config/postgresql.conf
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: admin
        - name: POSTGRES_INITDB_ARGS
          value: --encoding=UTF8 --locale=en_US.utf8 --auth-host=scram-sha-256 --auth-local=trust
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - containerPort: 5432
          name: postgres
        resources:
          requests:
            cpu: 100m
            memory: 384Mi
          limits:
            cpu: '1'
            memory: 768Mi
        startupProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
            - -d
            - postgres
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
            - -d
            - postgres
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
            - -d
            - postgres
          periodSeconds: 20
          failureThreshold: 6
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        - name: config
          mountPath: /config
          readOnly: true
        - name: tls-private
          mountPath: /run/postgres-tls
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: config
        configMap:
          name: postgres-config
      - name: tls
        secret:
          secretName: postgres-tls
      - name: tls-private
        emptyDir:
          medium: Memory
          sizeLimit: 1Mi
      - name: dshm
        emptyDir:
          medium: Memory
          sizeLimit: 128Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-provision
  namespace: postgres-nonproduction
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: '1'
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        postgres.vdzonsoftware.nl/operator: 'true'
    spec:
      serviceAccountName: postgres-provision
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision
        image: ghcr.io/robbertvdzon/postgresql-platform@sha256:98e9b47349b6f6df19714537f3cf39e46d8c6c38229109ce79cafddb9a8e342f
        args:
        - provision
        env:
        - name: PGHOST
          value: postgres.postgres-nonproduction.svc
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: postgres
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: admin
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /pgca/ca.crt
        - name: PGCONNECT_TIMEOUT
          value: '10'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: ca
          mountPath: /pgca
          readOnly: true
        - name: scratch
          mountPath: /scratch
        - name: credentials
          mountPath: /credentials
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: postgres-config
      - name: ca
        secret:
          secretName: postgres-tls
          items:
          - key: ca.crt
            path: ca.crt
      - name: scratch
        emptyDir:
          sizeLimit: 4Gi
      - name: credentials
        secret:
          secretName: postgres-credentials
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: postgres-nonproduction
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  namespace: postgres-nonproduction
spec:
  podSelector:
    matchLabels:
      app: central-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: agent-runtime-acceptance
      podSelector:
        matchLabels:
          postgres.vdzonsoftware.nl/client: 'true'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hkh-acceptance
      podSelector:
        matchLabels:
          postgres.vdzonsoftware.nl/client: 'true'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: hkh-autopilot-acceptance
      podSelector:
        matchLabels:
          postgres.vdzonsoftware.nl/client: 'true'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: product-factory-acceptance
      podSelector:
        matchLabels:
          postgres.vdzonsoftware.nl/client: 'true'
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pvdd-acceptance
      podSelector:
        matchLabels:
          postgres.vdzonsoftware.nl/client: 'true'
    - namespaceSelector:
        matchLabels:
          preview.vdzonsoftware.nl/managed-by: preview-reconciler
      podSelector:
        matchLabels:
          postgres.vdzonsoftware.nl/client: 'true'
    - podSelector:
        matchLabels:
          postgres.vdzonsoftware.nl/operator: 'true'
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operator-egress
  namespace: postgres-nonproduction
spec:
  podSelector:
    matchLabels:
      postgres.vdzonsoftware.nl/operator: 'true'
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: central-postgres
    ports:
    - protocol: TCP
      port: 5432
  - ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 5353
    - protocol: TCP
      port: 5353
  - ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 6443

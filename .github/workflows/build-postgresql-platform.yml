name: Build PostgreSQL platform
on:
  push:
    branches: [main]
    paths: ['postgresql/**', '.github/workflows/build-postgresql-platform.yml']
  pull_request:
    paths: ['postgresql/**', '.github/workflows/build-postgresql-platform.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s postgresql/tests -v
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: postgresql
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/postgresql-platform:sha-${{ github.sha }}

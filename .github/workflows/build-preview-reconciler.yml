name: Build preview reconciler

on:
  push:
    branches: [main]
    paths:
      - "preview-reconciler/**"
      - ".github/workflows/build-preview-reconciler.yml"
  pull_request:
    paths:
      - "preview-reconciler/**"
      - ".github/workflows/build-preview-reconciler.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test fail-closed lifecycle rules
        working-directory: preview-reconciler
        run: python -m unittest -v

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build metadata
        id: metadata
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: preview-reconciler
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/preview-reconciler:${{ steps.metadata.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/preview-reconciler:main
          cache-from: type=gha,scope=preview-reconciler
          cache-to: type=gha,mode=max,scope=preview-reconciler

      - name: Pin deployed reconciler image
        if: github.event_name == 'push'
        shell: bash
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          git pull --rebase origin main
          sed -i "s#image: ghcr.io/robbertvdzon/preview-reconciler:.*#image: ghcr.io/robbertvdzon/preview-reconciler:${IMAGE_TAG}#" \
            manifests/root-app/apps/preview-reconciler.yaml
          if git diff --quiet -- manifests/root-app/apps/preview-reconciler.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/root-app/apps/preview-reconciler.yaml
          git commit -m "deploy: pin preview reconciler to ${IMAGE_TAG} [skip ci]"
          git push

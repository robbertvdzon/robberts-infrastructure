name: Build preview reconciler

on:
  push:
    branches: [main]
    paths:
      - "preview-reconciler/**"
      - ".github/workflows/build-preview-reconciler.yml"
  pull_request:
    paths:
      - "preview-reconciler/**"
      - ".github/workflows/build-preview-reconciler.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test fail-closed lifecycle rules
        working-directory: preview-reconciler
        run: python -m unittest -v

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: preview-reconciler
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/preview-reconciler:main
          cache-from: type=gha,scope=preview-reconciler
          cache-to: type=gha,mode=max,scope=preview-reconciler
